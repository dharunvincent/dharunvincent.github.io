name: Sync Notion Blog Posts

on:
  workflow_dispatch:          # manual trigger from GitHub UI
  push:
    branches: [main, blog]
    paths:
      - 'scripts/sync-notion.js'
      - '.github/workflows/sync-blog.yml'
      - 'package.json'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Sync blog posts from Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node scripts/sync-notion.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blogs/ package-lock.json
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "chore: sync blog posts from Notion [skip ci]"
          git push
